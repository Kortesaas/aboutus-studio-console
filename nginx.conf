server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /ha-websocket {
    proxy_pass http://homeassistant:8123/api/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Same-origin passthrough for locally-proxied media (e.g. media_player
  # album art served via Home Assistant's own /api/media_player_proxy/...
  # rather than an external CDN URL). Read-only asset fetches; the dashboard
  # never calls any other /api/ route directly.
  location /api/ {
    proxy_pass http://homeassistant:8123/api/;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
